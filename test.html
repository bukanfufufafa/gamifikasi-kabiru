<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Batik · Coba di Baju</title>
<style>
:root{--bg:#1d1410;--panel:#2a1c15;--line:#4a3425;--ink:#f3e7cf;--mute:#b9a487;--gold:#d9a441;--indigo:#27456f}
@media (prefers-color-scheme:light){:root{--bg:#f2e8d3;--panel:#fbf4e4;--line:#d6c29c;--ink:#2b1a10;--mute:#7a634a;--gold:#9c6a12;--indigo:#27456f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}
header{padding:28px clamp(16px,4vw,48px) 8px;max-width:1280px;margin:auto}
h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:.01em;font-weight:400}
header p{margin:6px 0 0;color:var(--mute);max-width:60ch}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;max-width:1280px;margin:auto;padding:16px clamp(16px,4vw,48px) 48px}
@media(max-width:860px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{margin:0 0 12px;font-size:20px;font-weight:400}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
select,input[type=range],input[type=color],button{font:inherit}
select{width:100%;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.chip:focus-visible,button:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.b{padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.main{background:var(--gold);color:#1d1410;border-color:var(--gold);font-weight:bold}
button.b:hover{border-color:var(--gold)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#tile{width:100%;max-width:340px;aspect-ratio:1;display:block;margin:0 auto;border:1px solid var(--line);border-radius:6px;cursor:crosshair;touch-action:none;image-rendering:auto}
.stage{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center}
#out{width:100%;height:100%;object-fit:contain;display:none}
#out.mirror{transform:scaleX(-1)}
#hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#d8c8a8;font-size:15px}
#status{margin:10px 0 0;color:var(--mute);font-size:14px;min-height:22px}
video{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<header>
  <h1>Studio Batik</h1>
  <p>Rancang motif batik, lalu lihat langsung di bajumu lewat kamera. Pemrosesan berjalan di perangkatmu, tidak ada video yang dikirim ke server.</p>
</header>
<main>
  <section aria-label="Desain batik">
    <h2>Desain kain</h2>
    <canvas id="tile" width="256" height="256" tabindex="0" aria-label="Kanvas motif batik, gambar dengan mouse atau jari"></canvas>
    <label for="motif">Motif dasar</label>
    <select id="motif">
      <option value="parang">Parang</option>
      <option value="kawung">Kawung</option>
      <option value="mega">Mega mendung</option>
      <option value="truntum">Truntum</option>
      <option value="flora">Ceplok bunga</option>
      <option value="none">Polos (gambar sendiri)</option>
    </select>
    <label>Palet warna</label>
    <div class="chips" id="chips"></div>
    <div class="row">
      <div><label for="cBg">Latar</label><input type="color" id="cBg" value="#3b2314"></div>
      <div><label for="cFg">Motif</label><input type="color" id="cFg" value="#d9a441"></div>
      <div><label for="cAc">Aksen</label><input type="color" id="cAc" value="#f1e2c0"></div>
    </div>
    <label for="size">Ukuran kuas: <span id="sizeV">6</span></label>
    <input type="range" id="size" min="1" max="30" value="6">
    <div class="two">
      <div><label for="sym">Simetri</label>
        <select id="sym"><option value="1">Bebas</option><option value="4">Cermin 4 arah</option></select></div>
      <div><label for="tool">Alat</label>
        <select id="tool"><option value="draw">Kuas aksen</option><option value="fg">Kuas motif</option><option value="erase">Penghapus</option></select></div>
    </div>
    <div class="btns">
      <button class="b" id="clear">Hapus coretan</button>
      <button class="b" id="dlTile">Simpan motif (PNG)</button>
    </div>
  </section>

  <section aria-label="Coba di baju">
    <h2>Coba di baju</h2>
    <div class="stage">
      <canvas id="out"></canvas>
      <div id="hint">Nyalakan kamera, lalu berdirilah agar baju terlihat jelas dengan cahaya cukup.</div>
    </div>
    <video id="cam" playsinline muted></video>
    <div class="btns">
      <button class="b main" id="start">Nyalakan kamera</button>
      <button class="b" id="stop" disabled>Matikan</button>
      <button class="b" id="flip" disabled>Ganti kamera</button>
      <button class="b" id="snap" disabled>Ambil foto</button>
      <button class="b" id="calib" disabled>Kalibrasi hadap depan</button>
    </div>
    <div class="two">
      <div><label for="scale">Skala motif: <span id="scaleV">1.0</span></label><input type="range" id="scale" min="0.3" max="2" step="0.05" value="1"></div>
      <div><label for="rot">Rotasi: <span id="rotV">0</span>°</label><input type="range" id="rot" min="-90" max="90" step="1" value="0"></div>
      <div><label for="shade">Bayangan kain: <span id="shadeV">80</span>%</label><input type="range" id="shade" min="0" max="100" value="80"></div>
      <div><label for="hem">Batas bawah baju: <span id="hemV">10</span>%</label><input type="range" id="hem" min="-10" max="50" value="10"></div>
      <div><label for="fold">Ikut lipatan kain: <span id="foldV">50</span>%</label><input type="range" id="fold" min="0" max="100" value="50"></div>
      <div><label for="turn">Putaran motif: <span id="turnV">100</span>%</label><input type="range" id="turn" min="0" max="150" value="100"></div>
      <div><label for="crack">Retakan malam: <span id="crackV">30</span>%</label><input type="range" id="crack" min="0" max="100" value="30"></div>
      <div><label><input type="checkbox" id="arm" checked> Pemetaan lengan baju</label></div>
      <div><label for="opa">Kepekatan: <span id="opaV">95</span>%</label><input type="range" id="opa" min="30" max="100" value="95"></div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
</main>

<script type="module">
const $=id=>document.getElementById(id);
const S=256;
/* ---------- Desain kain ---------- */
const tile=$('tile'),tctx=tile.getContext('2d');
const base=document.createElement('canvas'),layer=document.createElement('canvas');
base.width=base.height=layer.width=layer.height=S;
const bctx=base.getContext('2d'),lctx=layer.getContext('2d');
let dirty=true,texDirty=true;
const palettes=[['#3b2314','#d9a441','#f1e2c0'],['#102a4c','#f1e6c8','#7fa7d6'],['#6e1a1a','#f4d9a0','#1b1b1b'],['#16392e','#e8c872','#f4efe1']];
const chips=$('chips');
palettes.forEach((p,i)=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-label','Palet '+(i+1));
  b.style.background=`linear-gradient(135deg,${p[0]} 50%,${p[1]} 50%)`;
  b.onclick=()=>{$('cBg').value=p[0];$('cFg').value=p[1];$('cAc').value=p[2];render()};chips.appendChild(b)});

function wrap(g,fn){for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){g.save();g.translate(i*S,j*S);fn();g.restore()}}
const motifs={
 kawung(g,bg,fg,ac){wrap(g,()=>{for(let i=0;i<2;i++)for(let j=0;j<2;j++){const cx=64+128*i,cy=64+128*j;
  for(let k=0;k<4;k++){const a=k*Math.PI/2;g.beginPath();g.ellipse(cx+Math.cos(a)*26,cy+Math.sin(a)*26,38,19,a,0,7);g.fillStyle=fg;g.fill();g.lineWidth=2;g.strokeStyle=bg;g.stroke()}
  g.beginPath();g.arc(cx,cy,6,0,7);g.fillStyle=ac;g.fill()}})},
 parang(g,bg,fg,ac){wrap(g,()=>{for(let i=-3;i<=3;i++){const c=i*S/4;
  for(const [w,col,off] of [[16,fg,0],[3,ac,16]]){g.beginPath();for(let x=-S;x<=2*S;x+=4){const y=x+c+off+14*Math.sin(2*Math.PI*2*x/S);x===-S?g.moveTo(x,y):g.lineTo(x,y)}
   g.lineWidth=w;g.strokeStyle=col;g.lineCap='round';g.stroke()}
  for(let x=0;x<S;x+=S/4){g.beginPath();g.arc(x+S/8,x+S/8+c+34,3,0,7);g.fillStyle=ac;g.fill()}}})},
 mega(g,bg,fg,ac){wrap(g,()=>{for(const [cx,cy] of [[64,150],[192,22],[192,278],[64,-106]]){
  for(let r=58,n=0;r>6;r-=9,n++){g.beginPath();g.ellipse(cx,cy,r*1.5,r,0,Math.PI,2*Math.PI);g.closePath();g.fillStyle=n%2?ac:fg;g.fill();g.lineWidth=1.5;g.strokeStyle=bg;g.stroke()}}})},
 truntum(g,bg,fg,ac){wrap(g,()=>{for(let i=0;i<4;i++)for(let j=0;j<4;j++){const x=i*64+(j%2?32:0)+16,y=j*64+16;g.save();g.translate(x,y);g.strokeStyle=fg;g.lineWidth=3;g.lineCap='round';
  for(let k=0;k<4;k++){g.rotate(Math.PI/4);g.beginPath();g.moveTo(-13,0);g.lineTo(13,0);g.stroke()}
  g.fillStyle=ac;for(const [dx,dy] of [[24,0],[-24,0],[0,24],[0,-24]]){g.beginPath();g.arc(dx,dy,2.5,0,7);g.fill()}g.restore()}})},
 flora(g,bg,fg,ac){wrap(g,()=>{for(const [cx,cy] of [[64,64],[192,192]]){for(let k=0;k<8;k++){const a=k*Math.PI/4;g.beginPath();g.ellipse(cx+Math.cos(a)*28,cy+Math.sin(a)*28,22,10,a,0,7);g.fillStyle=fg;g.fill();g.lineWidth=2;g.strokeStyle=ac;g.stroke()}
  g.beginPath();g.arc(cx,cy,12,0,7);g.fillStyle=ac;g.fill()}
  for(const [cx,cy] of [[192,64],[64,192]]){g.save();g.translate(cx,cy);for(let k=0;k<4;k++){g.rotate(Math.PI/2);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(14,-20,0,-40);g.quadraticCurveTo(-14,-20,0,0);g.fillStyle=ac;g.fill()}g.restore()}})},
 none(){}
};
function render(){
  const bg=$('cBg').value,fg=$('cFg').value,ac=$('cAc').value;
  bctx.fillStyle=bg;bctx.fillRect(0,0,S,S);motifs[$('motif').value](bctx,bg,fg,ac);compose();
}
function compose(){tctx.drawImage(base,0,0);tctx.drawImage(layer,0,0);dirty=texDirty=true}
['motif','cBg','cFg','cAc'].forEach(id=>$(id).addEventListener('input',render));
$('size').oninput=e=>$('sizeV').textContent=e.target.value;
$('clear').onclick=()=>{lctx.clearRect(0,0,S,S);compose()};
$('dlTile').onclick=()=>{const a=document.createElement('a');a.href=tile.toDataURL('image/png');a.download='motif-batik.png';a.click()};

let last=null;
function stroke(x0,y0,x1,y1){
  const t=$('tool').value,sz=+$('size').value;
  lctx.lineWidth=sz;lctx.lineCap=lctx.lineJoin='round';
  lctx.globalCompositeOperation=t==='erase'?'destination-out':'source-over';
  lctx.strokeStyle=t==='fg'?$('cFg').value:$('cAc').value;
  const pts=[[x0,y0,x1,y1]];
  if($('sym').value==='4')pts.push([S-x0,y0,S-x1,y1],[x0,S-y0,x1,S-y1],[S-x0,S-y0,S-x1,S-y1]);
  for(const [a,b,c,d] of pts)for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){lctx.beginPath();lctx.moveTo(a+i*S,b+j*S);lctx.lineTo(c+i*S+.01,d+j*S);lctx.stroke()}
  compose();
}
const pos=e=>{const r=tile.getBoundingClientRect();return[(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height]};
tile.addEventListener('pointerdown',e=>{tile.setPointerCapture(e.pointerId);last=pos(e);stroke(...last,...last)});
tile.addEventListener('pointermove',e=>{if(!last)return;const p=pos(e);stroke(...last,...p);last=p});
['pointerup','pointercancel'].forEach(n=>tile.addEventListener(n,()=>last=null));
render();

/* ---------- Kamera + segmentasi pakaian ---------- */
const cam=$('cam'),out=$('out'),octx=out.getContext('2d'),status=$('status');
const fab=document.createElement('canvas'),fctx=fab.getContext('2d');
const shd=document.createElement('canvas'),sctx=shd.getContext('2d');
const mk=document.createElement('canvas'),mctx=mk.getContext('2d');
let seg=null,pose=null,G=null,GL=null,visS=[0,0,0,0],yawS=0,refR=0,lastR0=1,exuPrev=null,cut={ok:false,X:.5,Y:1,sl:0},poseLost=99,pf=0,stream=null,facing='user',running=false,pattern=null,alpha=null,cx=0,cy=0,bw=0,lastT=-1;
const setS=t=>status.textContent=t;
for(const id of ['scale','rot','shade','opa','hem','fold','turn','crack'])$(id).addEventListener('input',()=>$(id+'V').textContent=(id==='scale'?(+$(id).value).toFixed(1):$(id).value));

async function loadAI(){
  if(seg)return;
  setS('Memuat model AI (sekali saja, ±16 MB)…');
  const {ImageSegmenter,PoseLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opt=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite',delegate:d},runningMode:'VIDEO',outputCategoryMask:true,outputConfidenceMasks:false});
  try{seg=await ImageSegmenter.createFromOptions(fs,opt('GPU'))}catch{seg=await ImageSegmenter.createFromOptions(fs,opt('CPU'))}
  const po=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:1});
  try{pose=await PoseLandmarker.createFromOptions(fs,po('GPU'))}catch{pose=await PoseLandmarker.createFromOptions(fs,po('CPU'))}
  GL=initGL();
}
async function startCam(){
  try{
    $('start').disabled=true;
    await loadAI();
    stream?.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:960},height:{ideal:720}},audio:false});
    cam.srcObject=stream;await cam.play();
    const w=cam.videoWidth,h=cam.videoHeight;
    for(const c of [out,fab,shd,mk]){c.width=w;c.height=h}
    alpha=new Float32Array(w*h);cx=w/2;cy=h/2;bw=w*.5;
    out.style.display='block';out.classList.toggle('mirror',facing==='user');$('hint').style.display='none';
    ['stop','flip','snap','calib'].forEach(i=>$(i).disabled=false);
    setS('Kamera aktif. Baju terdeteksi otomatis, coba gerak pelan.');
    if(!running){running=true;loop()}
  }catch(e){
    $('start').disabled=false;
    setS(e.name==='NotAllowedError'?'Izin kamera ditolak. Aktifkan izin kamera di browser, lalu coba lagi.':'Gagal memulai: '+e.message+' (kamera butuh HTTPS atau localhost).');
  }
}
function stopCam(){running=false;stream?.getTracks().forEach(t=>t.stop());stream=null;out.style.display='none';$('hint').style.display='grid';
  $('start').disabled=false;['stop','flip','snap','calib'].forEach(i=>$(i).disabled=true);setS('Kamera dimatikan.')}
$('calib').onclick=()=>{refR=lastR0;yawS=0;setS('Terkalibrasi: posisi hadap depan sekarang dianggap 0°.')};
$('start').onclick=startCam;$('stop').onclick=stopCam;
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCam()};
$('snap').onclick=()=>{const c=document.createElement('canvas');c.width=out.width;c.height=out.height;const g=c.getContext('2d');
  if(facing==='user'){g.translate(c.width,0);g.scale(-1,1)}g.drawImage(out,0,0);
  const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.92);a.download='coba-batik.jpg';a.click()};

function onMask(res){
  const m=res.categoryMask;if(!m)return;
  const d=m.getAsUint8Array(),w=m.width,h=m.height;
  if(mk.width!==w||mk.height!==h){mk.width=w;mk.height=h;alpha=new Float32Array(w*h)}
  const img=mctx.createImageData(w,h),px=img.data;
  let n=0,sx=0,sy=0,x0=w,x1=0;
  for(let i=0;i<d.length;i++){
    const x=i%w,y=(i/w)|0;
    const lim=cut.ok?cut.Y*h+cut.sl*(x-cut.X*w):1e9;   // garis batas pinggul (celana dibuang)
    const t=(d[i]===4&&y<=lim)?1:0;                  // kategori 4 = pakaian, hanya bagian atas
    const a=alpha[i]=alpha[i]*.55+t*.45;       // haluskan antar-frame agar tidak berkedip
    if(a>.04){px[i*4+3]=Math.min(255,a*300);}
    if(t){n++;sx+=x;sy+=y;if(x<x0)x0=x;if(x>x1)x1=x}
  }
  mctx.putImageData(img,0,0);
  if(n>w*h*.01){const k=.15;cx+=(sx/n-cx)*k;cy+=(sy/n-cy)*k;bw+=((x1-x0)-bw)*k}
}
/* ---------- Warp kain mengikuti badan (WebGL) ----------
   Koordinat kain dihitung per piksel dari bahu & pinggul: ikut miring/rotasi badan, menyempit
   ke pinggang, melengkung seperti silinder di sisi badan, dan bergeser mengikuti lipatan baju. */
const FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 uv;
uniform vec2 res,M,ey,exu,uLs,uLe,uLw,uRs,uRe,uRw;
uniform vec4 en;
uniform float shW,hipW,tilePx,rot,disp,yaw,refL,shadeK,crack;
uniform sampler2D tex,vid,msk;
// satu ruas lengan: (skor jarak, posisi sepanjang lengan px, posisi menyilang px)
vec4 seg(vec2 p,vec2 A,vec2 B,float rad){
  vec2 ab=B-A;float L=max(length(ab),1.);vec2 dir=ab/L;vec2 ap=p-A;
  float t=dot(ap,dir),tc=clamp(t,0.,L);
  float sc=length(ap-dir*tc)/rad+max(-t/L,0.)*3.;   // sebelum bahu dihukum agar dada tetap ikut peta badan
  return vec4(sc,t,dot(ap,vec2(-dir.y,dir.x)),L);
}
float lum(vec2 c){return dot(texture2D(vid,c).rgb,vec3(.3,.59,.11));}
vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return fract(sin(p)*43758.5453);}
float h1(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float cell(vec2 p){vec2 i=floor(p),f=fract(p);float d1=9.,d2=9.;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));float d=length(g+h2(i+g)-f);if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}
  return d2-d1;}
void main(){
  vec2 px=vec2(uv.x*res.x,(1.-uv.y)*res.y),d=px-M;
  float det=exu.x*ey.y-exu.y*ey.x;
  float a=(d.x*ey.y-d.y*ey.x)/det, b=(exu.x*d.y-exu.y*d.x)/det;
  float R=.5*mix(shW,hipW,clamp(b,0.,1.))/max(cos(yaw),.3);
  float sc=clamp(a/R,-.97,.97);
  vec2 q=vec2(R*(asin(sc)-yaw)+(a-R*sc), b*length(ey));
  // lengan baju: koordinat kain sendiri (silinder kecil sepanjang bahu-siku-pergelangan)
  float el0=shW/1.25,ra=.3*el0,rf=.25*el0;
  vec4 s0=seg(px,uLs,uLe,ra),s1=seg(px,uLe,uLw,rf),s2=seg(px,uRs,uRe,ra),s3=seg(px,uRe,uRw,rf);
  s0.x+=(1.-en.x)*9.;s1.x+=(1.-en.y)*9.;s2.x+=(1.-en.z)*9.;s3.x+=(1.-en.w)*9.;
  vec4 bs=s0;float off=0.,sd=-1.,rr=ra;
  if(s1.x<bs.x){bs=s1;off=length(uLe-uLs);sd=-1.;rr=rf;}
  if(s2.x<bs.x){bs=s2;off=0.;sd=1.;rr=ra;}
  if(s3.x<bs.x){bs=s3;off=length(uRe-uRs);sd=1.;rr=rf;}
  if(bs.x<1.15){float sa=clamp(bs.z/rr,-.97,.97);sc=sa;q=vec2(rr*asin(sa)+(bs.z-rr*sa)+sd*.4*tilePx,bs.y+off);}
  vec2 st=px/res,o=vec2(5.)/res;
